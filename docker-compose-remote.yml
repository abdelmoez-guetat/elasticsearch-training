version: '3'

services:
  elasticsearch-remote:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: elasticsearch-remote
    hostname: elasticsearch-remote
    volumes:
      - ./elasticsearch-remote/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./elasticsearch-remote/elastic-data:/usr/share/elasticsearch/data
      - ./elasticsearch-remote/elastic-backup:/usr/share/elasticsearch/backup
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - single_elastic_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://elasticsearch-remote:9200/_cluster/health || exit 1"]
      interval: 30s
      retries: 10
      timeout: 10s
    restart: unless-stopped

networks:
  single_elastic_network:
    driver: bridge


version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: es_exam_web
    ports:
      - "80:80"
    depends_on:
      - terminal
      - evaluator
      - kibana
    networks:
      - elastic_network
    restart: unless-stopped

  terminal:
    build:
      context: .
      dockerfile: terminal/Dockerfile
    container_name: es_exam_terminal
    networks:
      - elastic_network
    restart: unless-stopped

  evaluator:
    build:
      context: ./evaluator
    container_name: es_exam_evaluator
    networks:
      - elastic_network
    depends_on:
      - elasticsearch1
    restart: unless-stopped

  elasticsearch1:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: elasticsearch1
    hostname: elasticsearch1
    environment:
      - node.name=node1
      - cluster.name=elasticsearch-cluster
      - cluster.initial_master_nodes=node1,node2,node3
      - node.roles=master,data
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - elastic_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://elasticsearch1:9200/_cluster/health || exit 1"]
      interval: 15s
      retries: 10
      timeout: 10s
    restart: unless-stopped

  elasticsearch2:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: elasticsearch2
    hostname: elasticsearch2
    environment:
      - node.name=node2
      - cluster.name=elasticsearch-cluster
      - discovery.seed_hosts=elasticsearch1
      - cluster.initial_master_nodes=node1,node2,node3
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - elastic_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://elasticsearch2:9200/_cluster/health || exit 1"]
      interval: 15s
      retries: 10
      timeout: 10s
    restart: unless-stopped

  elasticsearch3:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: elasticsearch3
    hostname: elasticsearch3
    environment:
      - node.name=node3
      - cluster.name=elasticsearch-cluster
      - discovery.seed_hosts=elasticsearch1
      - cluster.initial_master_nodes=node1,node2,node3
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - elastic_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://elasticsearch3:9200/_cluster/health || exit 1"]
      interval: 15s
      retries: 10
      timeout: 10s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.2
    container_name: kibana
    hostname: kibana
    environment:
      - ELASTICSEARCH_HOSTS=["http://elasticsearch1:9200","http://elasticsearch2:9200","http://elasticsearch3:9200"]
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
      - CSP_STRICT=false
      - CSP_WARNLEGACYBROWSERS=false
    networks:
      - elastic_network
    depends_on:
      elasticsearch1:
        condition: service_healthy
      elasticsearch2:
        condition: service_healthy
      elasticsearch3:
        condition: service_healthy
    restart: unless-stopped

networks:
  elastic_network:
    driver: bridge

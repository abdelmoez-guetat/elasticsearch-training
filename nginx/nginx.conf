server {
    listen 80;
    server_name localhost;

    # Frontend UI
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Web Terminal Proxy (ttyd)
    location /ttyd/ {
        proxy_pass http://terminal:7681/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Kibana Cluster 1 Proxy
    location /kibana/ {
        proxy_pass http://kibana-c1:5601/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable/Override CSP headers so Kibana renders smoothly inside an iframe
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors 'self' *" always;
    }

    # Kibana Cluster 2 Proxy
    location /kibana-c2/ {
        proxy_pass http://kibana-c2:5601/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors 'self' *" always;
    }

    # Elastic Documentation Proxy & Static Assets
    location /guide/ {
        proxy_pass https://www.elastic.co/guide/;
        proxy_set_header Host www.elastic.co;
        proxy_ssl_server_name on;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /docs-proxy/ {
        proxy_pass https://www.elastic.co/guide/en/elasticsearch/reference/8.13/;
        proxy_set_header Host www.elastic.co;
        proxy_ssl_server_name on;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Evaluator API Proxy
    location /api/ {
        proxy_pass http://evaluator:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
